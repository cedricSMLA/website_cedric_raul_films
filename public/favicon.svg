<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Deux alliances entrelacées ; celle de gauche contient un diaphragme d'objectif.
       Couleurs du site : vert forêt et cuivre. -->
  <rect width="64" height="64" rx="13" fill="#26342B"/>
  <!-- Diaphragme -->
  <circle cx="20.85" cy="32" r="11.75" fill="#DBA27C"/>
  <path d="M24.82 33.45L21.58 36.17L17.61 34.72L16.88 30.55L20.12 27.83L24.09 29.28Z" fill="#26342B"/>
  <path d="M24.09 29.28L26.49 42.88M24.82 33.45L14.25 42.32M21.58 36.17L8.61 31.44M17.61 34.72L15.21 21.12M16.88 30.55L27.45 21.68M20.12 27.83L33.09 32.56" fill="none" stroke="#26342B" stroke-width="1.3"/>
  <g fill="none">
    <!-- Alliance de gauche -->
    <circle cx="20.85" cy="32" r="15.4" stroke="#DBA27C" stroke-width="3.9"/>
    <!-- Alliance de droite, par-dessus -->
    <circle cx="43.15" cy="32" r="15.4" stroke="#26342B" stroke-width="6.5"/>
    <circle cx="43.15" cy="32" r="15.4" stroke="#DBA27C" stroke-width="3.9"/>
    <!-- En haut, l'alliance de gauche repasse dessus : les anneaux sont entrelacés -->
    <path d="M26.72 17.76A15.4 15.4 0 0 1 35.36 26.83" stroke="#26342B" stroke-width="6.5"/>
    <path d="M25.96 17.47A15.4 15.4 0 0 1 35.61 27.60" stroke="#DBA27C" stroke-width="3.9"/>
  </g>
</svg>
